services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
      - '8001:8001'
    environment:
      - REDIS_ARGS=--save 60 1
    volumes:
      - redis-data:/data

  api:
    build: .
    command: npm start --workspace=packages/api
    ports:
      - '3001:3001'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

volumes:
  redis-data:
